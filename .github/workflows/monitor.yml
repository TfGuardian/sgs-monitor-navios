name: Executar Monitor APS

on:
  # O agendamento sera reativado apos a configuracao das credenciais da Meta.
  workflow_dispatch:

jobs:
  executar-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar codigo
        run: python -m compileall -q .

      - name: Executar script de monitoramento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_RECIPIENT_PHONE: ${{ secrets.META_RECIPIENT_PHONE }}
          META_TEMPLATE_NAME: ${{ secrets.META_TEMPLATE_NAME }}
          META_TEMPLATE_LANGUAGE: ${{ secrets.META_TEMPLATE_LANGUAGE }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          PRATICAGEM_URL: ${{ secrets.PRATICAGEM_URL }}
        run: python main.py
