name: Executar Monitor APS

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-navios-coleta
  cancel-in-progress: false

jobs:
  executar-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar codigo
        run: python -m compileall -q .

      - name: Executar script de monitoramento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Mantem compatibilidade com repositorios que ainda guardam a chave
          # administrativa no segredo legado SUPABASE_KEY.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          META_REPORT_TEMPLATE_NAME: ${{ vars.META_REPORT_TEMPLATE_NAME }}
          META_REPORT_TEMPLATE_LANGUAGE: ${{ vars.META_REPORT_TEMPLATE_LANGUAGE }}
          RELATORIO_WHATSAPP_ATIVO: ${{ vars.RELATORIO_WHATSAPP_ATIVO }}
        run: |
          if [ "$RELATORIO_WHATSAPP_ATIVO" = "true" ]; then
            python relatorio_horario.py
          else
            python main.py --sincronizar
          fi
