[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-monitor"
version = "0.1.0"
description = "Coleta portuaria e acompanhamento de movimentacoes de navios"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.2,<3",
  "lxml>=5.3,<7",
  "supabase>=2.10,<3",
  "urllib3>=2.2,<3",
  "html5lib>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "truststore>=0.10,<1",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
praticagem = ["playwright>=1.50,<2"]

[project.scripts]
vessel-monitor = "vessel_monitor.cli:executar"
vessel-observer = "vessel_monitor.runtime.worker:main"
vessel-collect = "vessel_monitor.application.praticagem_observador:main"

[tool.setuptools.packages.find]
where = ["src"]
